<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>Registration Form</h2>
<form>
<label>Full Name</label>
<input type="text"
placeholder="Enter full name" required>
<label>Email Address</label>
<input type="email"
placeholder="Enter email address" required>
<div class="row">
<div class="box">
<label>Phone Number</label>
<input type="text"
placeholder="Enter phone number">
</div>
<div class="box">
<label>Birth Date</label>
<input type="date">
</div>
</div>
<label>Gender</label>
<div class="gender"
<input type="radio"
name="gender"
checked>
Male

<input type="radio"
name="gender">

Female

<input type="radio"
name="gender">

Prefer not to say
</div>

<label>Address</label>

<input type="text"
placeholder="Enter street address">

<input type="text"
placeholder="Enter street address line 2">

<div class="row">

<div class="box">

<select>

<option>Country</option>

<option>India</option>

<option>USA</option>

<option>Canada</option>
</select>

</div>

<div class="box">

<input type="text"
placeholder="Enter your city">

</div>

</div>

<div class="row">

<div class="box">

<input type="text"
placeholder="Enter your region">

</div>

<div class="box">

<input type="text"
placeholder="Enter postal code">

</div>

</div>

<input
type="submit"
value="Submit">

</form>
</div>
</body>
</html>
