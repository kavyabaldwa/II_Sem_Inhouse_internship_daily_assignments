<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="big-light">
    <body style="background-color: #E6E6FA;"></body>
    <div class="container py-5">
        <h2 class="text-center mb-4">Student records</h2>
        <input type="text" id="search" class="form-control mb-4" placeholder="search student">
        <div id="container" class="row g-4"></div>
        <div id="json"></div>
        </div>
   
    <script>
        const students = [
            { name: "kavya",branch:"cse",cgpa:9.1 },
            { name: "anjali",branch:"cse",cgpa:9.1 },
            { name: "shabdh",branch:"cse",cgpa:8.9 },
            { name: "aarush",branch:"cse",cgpa:8.5 },
            { name: "lakshita",branch:"cse",cgpa:8.8 },
            { name: "leena",branch:"cse",cgpa:8.3 },
            { name: "lakshay",branch:"cse",cgpa:8.3 },
            { name: "shreenu",branch:"cse",cgpa:9.2 },
            { name: "rishi",branch:"cse",cgpa:9.0 },
            { name: "anviksha",branch:"cse",cgpa:9.8},
            { name: "lavish",branch:"cse",cgpa:8.5 },
             ];
             let html = "";
             for(let i=0; i<students.length; i++) {
                html += `
             
            <div class="col-md-4 card-item">
                <div class="card shadow">
                    <div class="card-body">
                        <h4>${students[i].name}</h4>
                        <button class="btn btn-primary btn-sm mt-2">
                            show details
                            </button>
                                <div class="details mt-3" style="display:none;">
                                    <p><strong>Branch:</strong>${students[i].branch}</p>
                                    <p><strong>Cgpa:</strong>${students[i].cgpa}</p>

                                     </div>
                                     </div>
                                     </div>
                                     </div>
                                     `;
             }
document.getElementById("container").innerHTML = html;
$(document).on("click",".btn",function(){
    $(this).next(".details").slideToggle();
});
 $("#search").keyup(function(){
    let val = $(this).val().toLowerCase();
    $(".card-item").each(function(){
        let name = $(this).find("h4").text().toLowerCase();
        if(name.includes(val)){
            $(this).show();
        }
        else{
            $(this).hide();
        }
    });
 });

 document.getElementById("json").innerHTML=JSON.stringify(students,["name", "cgpa"], 4);

 //3. replacer(function)
 function replace(key,value){
    if(key=="cgpa")
    return undefined; //remove cgpa
return value;
 }
    </script>
</body>
</html>
